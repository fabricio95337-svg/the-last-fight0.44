<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>THE LAST FIGHT 0.45</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial;overflow:hidden;touch-action:none}
#app{height:100dvh;display:flex;flex-direction:column}
header{height:48px;display:flex;align-items:center;justify-content:space-around;color:#f5c66b;font-weight:bold;font-size:19px}
button{background:linear-gradient(#bd8038,#74451f);color:white;border:2px solid #f5c66b;border-radius:15px;font-weight:bold;padding:12px}
#hud{display:flex;justify-content:space-around;padding:8px;background:#111c2d}
#arena{flex:1;min-height:0}
canvas{width:100%;height:100%;display:block}
#controls{height:155px;display:flex;align-items:center;justify-content:space-around;padding:10px;gap:10px}
#stick{width:115px;height:115px;border-radius:50%;background:#253950;border:3px solid #91a8bc;position:relative;flex-shrink:0}
#knob{position:absolute;width:53px;height:53px;left:28px;top:28px;border-radius:50%;background:#d6b36e;border:3px solid white}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.actions button{min-width:72px;min-height:55px;font-size:13px}
#attack{grid-row:span 2;min-height:118px;background:linear-gradient(#d59b43,#87501e)}
@media(orientation:landscape){
header{height:35px}#hud{padding:3px}#controls{height:105px}
#stick{width:90px;height:90px}#knob{left:20px;top:20px}
#attack{min-height:82px}
}
</style>
</head>
<body>
<div id="app">
<header>
<span>⚔ THE LAST FIGHT 0.45</span>
<button id="full">⛶ FULLSCREEN</button>
</header>
<div id="hud">
<span>❤️ <b id="hp">100</b></span>
<span>⭐ NIVEL 1</span>
<span>💰 <b id="gold">0</b></span>
</div>
<div id="arena"><canvas id="game" width="900" height="500"></canvas></div>
<div id="controls">
<div id="stick"><div id="knob"></div></div>
<div class="actions">
<button id="jump">⬆ SALTAR</button>
<button id="dodge">➤ ESQUIVAR</button>
<button id="attack">⚔ ATACAR</button>
<button id="special">✦ ESPECIAL</button>
</div>
</div>
</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
const $=id=>document.getElementById(id);
let p={x:130,y:350,h:100,v:0,face:1};
let e={x:700,h:100};
let gold=0,dead=false,won=false,move=0,specialReady=true;
function draw(){
let g=x.createLinearGradient(0,0,0,500);
g.addColorStop(0,'#101d39');g.addColorStop(1,'#45615a');
x.fillStyle=g;x.fillRect(0,0,900,500);
x.fillStyle='#f4d99c';x.beginPath();x.arc(730,85,37,0,7);x.fill();
x.fillStyle='#172a3b';
x.beginPath();x.moveTo(0,400);x.lineTo(180,180);x.lineTo(340,400);x.lineTo(520,170);x.lineTo(730,400);x.lineTo(900,230);x.lineTo(900,500);x.lineTo(0,500);x.fill();
x.fillStyle='#304b35';x.fillRect(0,400,900,100);
x.fillStyle='#78965b';x.fillRect(0,400,900,6);
function person(a,b,color,enemy=false){
x.fillStyle='#0006';x.beginPath();x.ellipse(a,b+5,30,8,0,0,7);x.fill();
x.fillStyle=color;x.fillRect(a-20,b-85,40,58);
x.fillStyle='#dca77e';x.beginPath();x.arc(a,b-103,18,0,7);x.fill();
x.fillStyle='#293447';x.fillRect(a-18,b-120,36,12);
x.fillStyle='#ddd';x.fillRect(a+10,b-63,36,7);
x.fillStyle='#263345';x.fillRect(a-17,b-28,13,29);x.fillRect(a+5,b-28,13,29);
}
person(p.x,400,'#2589d2');
if(e.h>0)person(e.x,400,'#a6384a',true);
x.fillStyle='#333';x.fillRect(20,25,200,15);
x.fillStyle='#34db75';x.fillRect(20,25,200*p.h/100,15);
x.fillStyle='#333';x.fillRect(680,25,200,15);
x.fillStyle='#ed4658';x.fillRect(680,25,200*e.h/100,15);
if(dead||won){
x.fillStyle='#000b';x.fillRect(0,0,900,500);
x.fillStyle='#ffdc8b';x.font='bold 48px Arial';
x.textAlign='center';x.fillText(won?'¡VICTORIA!':'FIN DEL JUEGO',450,260);x.textAlign='left';
}
}
function attack(){
if(dead||won)return;
if(Math.abs(p.x-e.x)<130){
e.h=Math.max(0,e.h-25);
if(e.h===0){won=true;gold+=50;$('gold').textContent=gold;}
}
}
function jump(){if(p.y>=350)p.v=-13}
function dodge(){p.x=Math.max(30,Math.min(870,p.x+p.face*100))}
function special(){
if(!specialReady||dead||won)return;
specialReady=false;e.h=Math.max(0,e.h-45);
if(e.h===0){won=true;gold+=50;$('gold').textContent=gold;}
setTimeout(()=>specialReady=true,4000);
}
$('attack').onclick=attack;
$('jump').onclick=jump;
$('dodge').onclick=dodge;
$('special').onclick=special;
$('full').onclick=async()=>{
try{
if(!document.fullscreenElement){
await document.documentElement.requestFullscreen();
if(screen.orientation?.lock)await screen.orientation.lock('landscape').catch(()=>{});
}else await document.exitFullscreen();
}catch(err){}
};
const stick=$('stick'),knob=$('knob');
let active=false;
function joystick(ev){
let r=stick.getBoundingClientRect();
let dx=ev.clientX-(r.left+r.width/2);
let max=r.width*.32;
dx=Math.max(-max,Math.min(max,dx));
knob.style.transform='translateX('+dx+'px)';
move=dx/max;
}
stick.onpointerdown=ev=>{active=true;stick.setPointerCapture(ev.pointerId);joystick(ev)};
stick.onpointermove=ev=>{if(active)joystick(ev)};
stick.onpointerup=stick.onpointercancel=()=>{active=false;move=0;knob.style.transform='translateX(0)'};
function update(){
if(!dead&&!won){
p.x=Math.max(25,Math.min(875,p.x+move*4));
if(move!==0)p.face=move>0?1:-1;
p.v+=.7;p.y=Math.min(350,p.y+p.v);
if(p.y===350)p.v=0;
if(e.h>0&&Math.abs(p.x-e.x)<100){
e.x+=(e.x>p.x?1:-1)*1.2;
if(Math.random()<.005){
p.h=Math.max(0,p.h-5);$('hp').textContent=p.h;
if(p.h===0)dead=true;
}
}
}
draw();requestAnimationFrame(update);
}
function restart(){
p={x:130,y:350,h:100,v:0,face:1};
e={x:700,h:100};dead=false;won=false;gold=0;
$('hp').textContent=100;$('gold').textContent=0;
}
update();
</script>
</body>
</html>
